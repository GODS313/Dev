<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#083f57"><title>پیگیری درخواست | همکاره</title><link rel="icon" href="/favicon.svg" type="image/svg+xml"><style>*{box-sizing:border-box}body{margin:0;background:#f2f7f8;color:#102a36;font-family:Tahoma,Arial,sans-serif;line-height:1.8}.wrap{width:min(620px,calc(100% - 28px));margin:55px auto}.brand{display:inline-block;color:#083f57;font-size:1.25rem;font-weight:900;text-decoration:none;margin-bottom:20px}.card{background:#fff;border:1px solid #dce8ec;border-radius:22px;padding:26px;box-shadow:0 18px 55px rgba(8,63,87,.1)}h1{margin:0 0 5px}p{color:#637984}label{display:block;font-weight:700;margin:13px 0 5px}input{width:100%;min-height:49px;border:1px solid #dce8ec;border-radius:12px;padding:0 13px;font:inherit;outline:none}input:focus{border-color:#0b6686;box-shadow:0 0 0 3px rgba(11,102,134,.1)}button{width:100%;min-height:50px;margin-top:18px;border:0;border-radius:13px;background:#083f57;color:#fff;font:inherit;font-weight:800;cursor:pointer}.result{display:none;margin-top:18px;padding:15px;border-radius:13px;background:#edf8f5}.result.show{display:block}.result.error{background:#fff0ee;color:#b42318}.row{display:flex;justify-content:space-between;gap:15px;border-bottom:1px solid #dce8ec;padding:7px 0}.row:last-child{border:0}.back{display:block;text-align:center;margin-top:18px;color:#0b6686}</style></head><body><main class="wrap"><a class="brand" href="/">همکاره</a><section class="card"><h1>پیگیری درخواست</h1><p>کد پیگیری و چهار رقم آخر شماره موبایل ثبت‌شده را وارد کنید.</p><form id="code-form"><label for="code">کد پیگیری</label><input id="code" dir="ltr" autocomplete="off" maxlength="12" pattern="[A-Za-z0-9]{6,12}" required><label for="last4">چهار رقم آخر موبایل</label><input id="last4" dir="ltr" inputmode="numeric" autocomplete="off" maxlength="4" pattern="[0-9]{4}" required><button id="submit" type="submit">نمایش وضعیت</button></form><div id="result" class="result" role="status" aria-live="polite"></div><a class="back" href="/">بازگشت به صفحه اصلی</a></section></main><script>const form=document.getElementById('code-form'),box=document.getElementById('result'),button=document.getElementById('submit');const names=['','آذربایجان شرقی','آذربایجان غربی','اردبیل','اصفهان','البرز','ایلام','بوشهر','تهران','چهارمحال و بختیاری','خراسان جنوبی','خراسان رضوی','خراسان شمالی','خوزستان','زنجان','سمنان','سیستان و بلوچستان','فارس','قزوین','قم','کردستان','کرمان','کرمانشاه','کهگیلویه و بویراحمد','گلستان','گیلان','لرستان','مازندران','مرکزی','هرمزگان','همدان','یزد'];function esc(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}const query=new URLSearchParams(location.search);if(query.get('code'))document.getElementById('code').value=query.get('code').toUpperCase();form.addEventListener('submit',async e=>{e.preventDefault();if(!form.reportValidity())return;button.disabled=true;box.className='result show';box.textContent='در حال دریافت وضعیت…';try{const code=document.getElementById('code').value.trim().toUpperCase(),last4=document.getElementById('last4').value.trim();const response=await fetch('/result.php?code='+encodeURIComponent(code)+'&last4='+encodeURIComponent(last4),{headers:{Accept:'application/json'}});const data=await response.json().catch(()=>({}));if(!response.ok||!data.ok)throw new Error(data.error||'درخواستی با این مشخصات پیدا نشد.');const r=data.record,province=names[Number(r.province)]||r.province;box.className='result show';box.innerHTML='<div class="row"><b>نام متقاضی</b><span>'+esc(r.name)+'</span></div><div class="row"><b>استان</b><span>'+esc(province)+'</span></div><div class="row"><b>وضعیت</b><span>در انتظار بررسی</span></div><div class="row"><b>زمان ثبت</b><span dir="ltr">'+esc(r.created_at)+'</span></div>'}catch(err){box.className='result show error';box.textContent=err.message||'خطا در ارتباط با سرور.'}finally{button.disabled=false}});</script></body></html>
