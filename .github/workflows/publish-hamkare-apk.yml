name: Publish Hamkare APK

on:
  workflow_dispatch:
    inputs:
      source_url:
        description: Approved Seskia HTTPS source URL
        required: true
        type: string
      sha256:
        description: Expected lowercase SHA-256 of the APK
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: hamkare-apk-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install APK verifier
        run: |
          sudo apt-get update
          sudo apt-get install -y apksigner unzip
      - name: Validate and publish verified APK
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_URL: ${{ inputs.source_url }}
          EXPECTED_SHA256: ${{ inputs.sha256 }}
        run: bash scripts/publish-hamkare-apk.sh "$SOURCE_URL" "$EXPECTED_SHA256"
