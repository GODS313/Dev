name: Publish Hamkare APK

on:
  push:
    branches: [main]
    paths:
      - uploads/hamkare.apk
  workflow_dispatch:
    inputs:
      source_url:
        description: Approved Seskia HTTPS source URL
        required: true
        type: string
      sha256:
        description: Expected lowercase SHA-256 of the APK
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: hamkare-apk-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install APK verifier
        run: |
          sudo apt-get update
          sudo apt-get install -y apksigner unzip
      - name: Validate and publish verified APK
        env:
          GH_TOKEN: ${{ github.token }}
          DISPATCH_SOURCE_URL: ${{ inputs.source_url }}
          DISPATCH_EXPECTED_SHA256: ${{ inputs.sha256 }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            source="$GITHUB_WORKSPACE/uploads/hamkare.apk"
            expected="$(sha256sum "$source" | awk '{print $1}')"
          else
            source="$DISPATCH_SOURCE_URL"
            expected="$DISPATCH_EXPECTED_SHA256"
          fi
          bash scripts/publish-hamkare-apk.sh "$source" "$expected"
