name: Release checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: PHP syntax
        run: |
          php -l hamkare-admin/admin.php
          php -l hamkare-admin/download.php
          php -l hamkare-admin/panel-lib.php
          php -l register.php
          php -l result.php
      - name: Shell syntax
        run: |
          bash -n \
            deploy-vps.sh \
            deploy-hamkare-bots.sh \
            install-hamkare-apk-panel.sh \
            install-hamkare-admin-vps.sh \
            enable-hamkare-telegram-direct-apk.sh \
            enable-hamkare-telegram-apk-release.sh \
            enable-hamkare-bale-direct-apk.sh \
            scripts/publish-hamkare-apk.sh
      - name: Python tests
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Node tests
        run: node --test tests/test_functions.mjs
      - name: JSON syntax
        run: |
          node -e "JSON.parse(require('fs').readFileSync('config.json'))"
          node -e "JSON.parse(require('fs').readFileSync('manifest.json'))"
