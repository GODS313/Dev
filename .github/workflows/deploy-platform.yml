name: Deploy platform

# Tests the modular platform and deploys it over FTPS to https://<domain>/panel
# (FTP only: this host blocks automated cPanel API logins).
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   CPANEL_USER, CPANEL_PASSWORD, ADMIN_PASSWORD
# Optional: CPANEL_HOST (default below)

on:
  push:
    branches: [main, claude/modular-management-marketing-system-ng9ms1]
    paths: ['platform/**', '.github/workflows/deploy-platform.yml']
  pull_request:
    paths: ['platform/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-platform
  cancel-in-progress: false

env:
  CPANEL_HOST: ${{ secrets.CPANEL_HOST || 'cp19.fra1.ultacp.com' }}
  SITE_URL: https://etebarami.net
  PANEL_PATH: /panel

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: pdo_sqlite, openssl, curl, mbstring
      - name: Lint
        run: find platform -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Tests
        run: php platform/tests/run.php

  deploy:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CPANEL_USER: ${{ secrets.CPANEL_USER }}
      CPANEL_PASSWORD: ${{ secrets.CPANEL_PASSWORD }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets
        id: secrets
        run: |
          if [ -z "$CPANEL_USER" ] || [ -z "$CPANEL_PASSWORD" ] || [ -z "$ADMIN_PASSWORD" ]; then
            echo "::warning::Deployment skipped: set CPANEL_USER, CPANEL_PASSWORD and ADMIN_PASSWORD repository secrets."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install lftp
        if: steps.secrets.outputs.ready == 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Stage files
        if: steps.secrets.outputs.ready == 'true'
        run: |
          set -eu
          mkdir -p stage/public_html/panel stage/platform/config stage/platform/storage
          cp -R platform/public/. stage/public_html/panel/
          cp -R platform/app platform/cli platform/migrations stage/platform/
          cp platform/config/.htaccess stage/platform/config/
          cp platform/storage/.htaccess stage/platform/storage/
          umask 077
          {
            echo "ADMIN_USER=${ADMIN_USER:-admin}"
            echo "ADMIN_PASSWORD=${ADMIN_PASSWORD}"
            echo "APP_TIMEZONE=Asia/Tehran"
            echo "BASE_PATH=$PANEL_PATH"
            echo "CRON_KEY=$(printf 'cron:%s' "$ADMIN_PASSWORD" | sha256sum | cut -c1-40)"
          } > stage/platform/config/app.env

      - name: Upload over FTPS
        if: steps.secrets.outputs.ready == 'true'
        run: |
          set -eu
          lftp -u "$CPANEL_USER,$CPANEL_PASSWORD" "$CPANEL_HOST" <<'EOF'
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set net:max-retries 3
          set net:timeout 30
          mirror -R --verbose=1 --no-perms stage/public_html/panel public_html/panel
          mirror -R --verbose=1 --no-perms stage/platform platform
          chmod 600 platform/config/app.env
          bye
          EOF

      - name: Smoke test
        if: steps.secrets.outputs.ready == 'true'
        run: |
          set -eu
          for i in 1 2 3 4 5 6; do
            body=$(curl -sS -m 20 "$SITE_URL$PANEL_PATH/health" || true)
            echo "$body" | head -c 200; echo
            if echo "$body" | grep -q '"ok":true'; then
              code=$(curl -sS -o /dev/null -w '%{http_code}' "$SITE_URL$PANEL_PATH/admin/login")
              echo "login page HTTP $code"
              [ "$code" = "200" ] && exit 0
            fi
            sleep 10
          done
          echo "::error::health check failed"
          exit 1
